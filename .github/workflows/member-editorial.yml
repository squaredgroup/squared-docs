name: Member Editorial Quality
on:
  push:
    branches: [content/member-editorial-20260926]
    paths:
      - 'content/**'
      - 'scripts/editorial/**'
      - 'tests/editorial_*'
      - '.github/workflows/member-editorial.yml'
permissions:
  contents: write
concurrency:
  group: member-editorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public source evidence
        run: python scripts/editorial/source_evidence.py
      - name: Build editorial content
        run: |
          if test -f scripts/editorial/build.py; then python scripts/editorial/build.py; fi
      - name: Validate editorial content
        run: |
          if test -f tests/editorial_contract.py; then python tests/editorial_contract.py; fi
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: member-editorial-audit
          path: /tmp/editorial-artifacts/
          retention-days: 7
      - name: Commit generated public pages on editorial branch only
        if: github.ref == 'refs/heads/content/member-editorial-20260926'
        run: |
          if ! test -f scripts/editorial/build.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' assets/ content/ sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(content): generate member documentation and verified navigation'
          git push origin HEAD:content/member-editorial-20260926

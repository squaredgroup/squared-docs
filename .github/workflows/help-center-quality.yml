name: Help Center Quality
on:
  push:
    branches: [main, help-center/operational-finish-20260919]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: help-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n 1 node --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: python tests/account_acceptance.py
      - name: Read-only public API boundaries
        run: python tests/public_boundaries.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-center-quality-report
          path: test-results/
          retention-days: 7

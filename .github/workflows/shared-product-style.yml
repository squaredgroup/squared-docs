name: Shared Squared Product Style
on:
  push:
    branches: [main, codex/shared-workspace-style-20261002]
    paths: ['assets/**', '**.html', 'tests/shared_product_style.py', 'tests/page_canvas_layout.py', '.github/workflows/shared-product-style.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser validation tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check shared components, themes and mobile interactions
        run: python tests/shared_product_style.py
      - name: Check the existing 16px page canvas contract
        run: python tests/page_canvas_layout.py
      - name: Preserve desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-squared-style
          path: test-results/
          retention-days: 14

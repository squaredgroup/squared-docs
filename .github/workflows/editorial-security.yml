name: Editorial Search Security
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/editorial_search_security.py'
      - '.github/workflows/editorial-security.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/editorial_search_security.py'
      - '.github/workflows/editorial-security.yml'
permissions:
  contents: read
concurrency:
  group: editorial-search-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/editorial/requirements.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Generate the same public sources as historical assistance
        run: |
          python scripts/integrate_assistance.py
          python scripts/finish_assistance.py
          python scripts/editorial/build.py
          python scripts/editorial/normalize_shell.py
      - name: Verify literal search content and safe links
        run: python tests/editorial_search_security.py
      - name: Save safe-rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-search-security
          path: test-results/editorial-search-*.json
          retention-days: 7

name: Mobile Layout Quality
on:
  push:
    branches: [main, fix/mobile-layout-20260919, fix/help-center-mobile-20260922]
    paths:
      - '**.html'
      - 'assets/**'
      - 'tests/mobile_layout.py'
      - 'tests/mobile_experience.py'
      - 'scripts/integrate_mobile_layout.py'
      - '.github/workflows/mobile-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate shared responsive assets
        run: python scripts/integrate_mobile_layout.py
      - name: JavaScript syntax
        run: |
          node --check assets/mobile-nav.js
          node --check assets/mobile-experience.js
      - name: Install isolated browser tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Mobile and desktop acceptance
        run: python tests/mobile_layout.py
      - name: All routes and mobile experience acceptance
        run: python tests/mobile_experience.py
      - name: Commit tested page integration on fix branches only
        if: github.ref == 'refs/heads/fix/mobile-layout-20260919' || github.ref == 'refs/heads/fix/help-center-mobile-20260922'
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mobile): integrate tested mobile experience and safe areas across all pages'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Summarize acceptance evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Mobile quality evidence\n\n')
              for name in ['mobile-layout.json','mobile-experience.json']:
                  file=Path('test-results')/name
                  if file.exists():
                      data=json.loads(file.read_text())
                      out.write(f"### {name}\nPassed: {data.get('passed')} — {len(data.get('checks',[]))} checks\n\n")
                      for failure in data.get('failures',[]): out.write(f'- {failure}\n')
              out.write('\nBackend isolated with mocks. No production account writes. Physical devices not tested.\n')
          PY
      - name: Save responsive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-evidence
          path: test-results/
          retention-days: 7
